<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tropico Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PIN EKRAN -->
  <div id="pin-screen">
    <div id="pin-box">
      <h2>☕ Tropico Manager</h2>
      <p>Unesite PIN</p>
      <div id="pin-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div id="pin-error"></div>
      <div id="pin-numpad">
        <button class="pin-btn" data-val="1">1</button>
        <button class="pin-btn" data-val="2">2</button>
        <button class="pin-btn" data-val="3">3</button>
        <button class="pin-btn" data-val="4">4</button>
        <button class="pin-btn" data-val="5">5</button>
        <button class="pin-btn" data-val="6">6</button>
        <button class="pin-btn" data-val="7">7</button>
        <button class="pin-btn" data-val="8">8</button>
        <button class="pin-btn" data-val="9">9</button>
        <button class="pin-btn" id="pin-clear">⌫</button>
        <button class="pin-btn" data-val="0">0</button>
        <button class="pin-btn" id="pin-submit">✓</button>
      </div>
    </div>
  </div>

<header class="hidden">
  <h1>☕ Tropico Manager</h1>
  <div id="header-clock">00:00:00</div>
  <div class="header-actions">
    <span id="header-waiter"></span>
    <button id="btn-fullscreen" class="btn-secondary">⛶ Fullscreen</button>
    <div id="dropdown-wrapper">
      <button id="btn-menu" class="btn-secondary">⚙️ ▾</button>
      <div id="dropdown-menu" class="hidden">
        <button id="btn-today-report">📊 Dnevni izvještaj</button>
        <button id="btn-history">📁 Istorija</button>
        <button id="btn-edit-mode">✏️ Uredi raspored</button>
        <button id="btn-change-pin">🔑 Promijeni PIN</button>
        <button id="btn-manage-waiters">👥 Konobari</button>
        <button id="btn-logout">🔒 Odjava</button>
      </div>
    </div>
  </div>
</header>

  <!-- GLAVNA POVRŠINA SA STOLOVIMA -->
  <main class="hidden">
    <div id="table-area">
      <div id="area-label-inside">Unutra</div>
      <div id="area-label-terrace">Bašta</div>
      <div id="sank">
        <span>ŠANK</span>
      </div>
    </div>
    <button id="btn-add-table" class="hidden">+ Dodaj sto</button>
    <button id="btn-finish-edit" class="hidden">✅ Završi uređivanje</button>
  </main>

 <!-- MODAL: Unos na stolu -->
<div id="modal-session" class="modal hidden">
  <div class="modal-box">
    <h2 id="modal-title">Sto 1</h2>
    <div id="session-info" class="hidden">
      <p>Gost: <strong id="session-guest"></strong> <span style="color:#aaa;font-size:0.85rem;">od <strong id="session-opened"></strong></span></p>
      <div id="session-items-list"></div>
      <p class="session-total-row">Ukupno: <strong id="session-total"></strong> KM</p>
    </div>
    <button id="btn-close-session" class="btn-danger hidden">✅ Plaćeno — resetuj sto</button>
    <div id="session-form">
      <input id="input-guest" type="text" placeholder="Ime gosta" />
      <div id="amount-display">0.00 KM</div>
      <div id="session-numpad">
        <button class="num-btn" data-val="1">1</button>
        <button class="num-btn" data-val="2">2</button>
        <button class="num-btn" data-val="3">3</button>
        <button class="num-btn" data-val="4">4</button>
        <button class="num-btn" data-val="5">5</button>
        <button class="num-btn" data-val="6">6</button>
        <button class="num-btn" data-val="7">7</button>
        <button class="num-btn" data-val="8">8</button>
        <button class="num-btn" data-val="9">9</button>
        <button class="num-btn" id="num-dot">.</button>
        <button class="num-btn" data-val="0">0</button>
        <button class="num-btn" id="num-clear">⌫</button>
      </div>
      <button id="btn-add-amount" class="btn-primary">Dodaj iznos</button>
    </div>
    <div class="modal-actions">
      <button id="btn-cancel" class="btn-secondary">Zatvori</button>
    </div>
  </div>
</div>

  <!-- MODAL: Dnevni izvještaj -->
  <div id="modal-report" class="modal hidden">
    <div class="modal-box">
      <h2>📊 Dnevni izvještaj</h2>
      <div id="report-content"></div>
      <div class="modal-actions">
        <button id="btn-export-pdf" class="btn-primary">⬇️ Skini PDF</button>
        <button id="btn-close-report" class="btn-secondary">Zatvori</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Istorija -->
  <div id="modal-history" class="modal hidden">
    <div class="modal-box">
      <h2>📁 Istorija izvještaja</h2>
      <div id="history-content"></div>
      <div class="modal-actions">
        <button id="btn-close-history" class="btn-secondary">Zatvori</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Dodaj sto (edit mode) -->
  <div id="modal-add-table" class="modal hidden">
    <div class="modal-box">
      <h2>Dodaj novi sto</h2>
      <input id="input-table-name" type="text" placeholder="Naziv stola (npr. Sto 1, Terasa...)" />
      <div class="modal-actions">
        <button id="btn-confirm-add-table" class="btn-primary">Dodaj</button>
        <button id="btn-cancel-add-table" class="btn-secondary">Odustani</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Promijeni PIN -->
<div id="modal-change-pin" class="modal hidden">
  <div class="modal-box">
    <h2>🔑 Promijeni PIN</h2>
    <p style="color:#aaa;font-size:0.9rem;">Unesite trenutni PIN</p>
    <div id="change-pin-dots-old" class="pin-dots-row">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <p style="color:#aaa;font-size:0.9rem;">Unesite novi PIN</p>
    <div id="change-pin-dots-new" class="pin-dots-row">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <div id="change-pin-error" style="color:#e94560;font-size:0.85rem;height:16px;"></div>
    <div id="change-pin-numpad" class="pin-numpad-grid">
      <button class="pin-btn" data-val="1">1</button>
      <button class="pin-btn" data-val="2">2</button>
      <button class="pin-btn" data-val="3">3</button>
      <button class="pin-btn" data-val="4">4</button>
      <button class="pin-btn" data-val="5">5</button>
      <button class="pin-btn" data-val="6">6</button>
      <button class="pin-btn" data-val="7">7</button>
      <button class="pin-btn" data-val="8">8</button>
      <button class="pin-btn" data-val="9">9</button>
      <button class="pin-btn" id="change-pin-clear">⌫</button>
      <button class="pin-btn" data-val="0">0</button>
      <button class="pin-btn" id="change-pin-submit">✓</button>
    </div>
    <div class="modal-actions">
      <button id="btn-cancel-change-pin" class="btn-secondary">Odustani</button>
    </div>
  </div>
</div>

<!-- MODAL: Konobari -->
<div id="modal-waiters" class="modal hidden">
  <div class="modal-box">
    <h2>👥 Konobari</h2>
    <div id="waiters-list"></div>
    <hr style="border-color:#0f3460;margin:10px 0;">
    <p style="color:#aaa;font-size:0.9rem;">Dodaj novog konobara</p>
    <input id="input-waiter-name" type="text" placeholder="Ime konobara" />
    <input id="input-waiter-pin" type="number" placeholder="PIN (4 cifre)" />
    <div class="modal-actions">
      <button id="btn-add-waiter" class="btn-primary">Dodaj</button>
      <button id="btn-close-waiters" class="btn-secondary">Zatvori</button>
    </div>
  </div>
</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
